version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/store/queries
    gen:
      go:
        package: db
        out: internal/store/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - { db_type: "uuid", go_type: { import: "github.com/google/uuid", type: "UUID" } }
          - { db_type: "uuid", nullable: true, go_type: { import: "github.com/google/uuid", type: "UUID", pointer: true } }
          - { db_type: "timestamptz", go_type: { import: "time", type: "Time" } }
          - { db_type: "timestamptz", nullable: true, go_type: { import: "time", type: "Time", pointer: true } }
